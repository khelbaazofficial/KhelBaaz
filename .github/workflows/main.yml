name: Create Flutter Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android Flutter project
        run: |
          rm -rf /tmp/khelbaaz_flutter
          flutter create \
            --platforms=android \
            --org com.khelbaaz \
            --project-name app \
            /tmp/khelbaaz_flutter

          sed -i 's/^name: app$/name: khelbaaz/' /tmp/khelbaaz_flutter/pubspec.yaml

          rsync -a \
            --exclude README.md \
            /tmp/khelbaaz_flutter/ ./

          flutter pub get

      - name: Save Flutter project to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Create KhelBaaz Flutter Android project"
            git push
          fi
