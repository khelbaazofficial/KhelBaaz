name: Build KhelBaaz APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons
        
      - name: Restore Release Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/khelbaaz-release-key.jks
      - name: Build ARM64 Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Prepare KhelBaaz APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk KhelBaaz.apk

      - name: Publish Latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KhelBaaz Latest APK
          body: Latest KhelBaaz Android APK.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: KhelBaaz.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
